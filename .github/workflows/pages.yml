name: Documentation site

on:
  push:
    # `main` is the release line; verified documentation merged to integration `dev` is also
    # published so prerelease features can be documented without prematurely releasing them.
    branches: [main, dev]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/branding/an.png"
      - "src/AgentNotify.Protocol/Schemas/**"
      - "scripts/build-site.sh"
      - "scripts/render-docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: ./scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
