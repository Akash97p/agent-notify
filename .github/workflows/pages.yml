name: Documentation site

on:
  push:
    # `main` is the release line; verified documentation merged to integration `dev` is also
    # published so prerelease features can be documented without prematurely releasing them.
    branches: [main, dev]
    paths:
      - "site/**"
      - "docs/**"
      - "assets/branding/an.png"
      - "src/AgentNotify.Protocol/Schemas/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: ./scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      # Keep the release-line environment's default-branch protection intact. Integration docs use
      # a separate environment because GitHub rejects `dev` deployments to `github-pages`.
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-dev' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
