name: CI

on:
  push:
    branches: [main, dev, "feature/**", "fix/**", "docs/**", "test/**", "chore/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore AgentNotify.slnx
      - name: Build
        run: dotnet build AgentNotify.slnx --configuration Release --no-restore
      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/AgentNotify.Tests/AgentNotify.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $resultPath = Join-Path $env:GITHUB_WORKSPACE "tests/AgentNotify.Tests/TestResults/test-results.trx"
            if (Test-Path $resultPath) {
              [xml]$results = Get-Content -Raw $resultPath
              $failed = Select-Xml -Xml $results -XPath "//*[local-name()='UnitTestResult' and @outcome='Failed']"
              foreach ($failure in $failed) {
                $name = $failure.Node.testName -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::error title=Failed test::$name"
              }
            }
          }
          exit $testExitCode
      - name: Package installer and embedded resources
        shell: pwsh
        run: ./scripts/package.ps1
