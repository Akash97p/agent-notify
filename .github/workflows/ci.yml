name: CI

on:
  push:
    branches: [main, dev, "feature/**", "fix/**", "docs/**", "test/**", "chore/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore AgentNotify.slnx
      - name: Build
        run: dotnet build AgentNotify.slnx --configuration Release --no-restore
      - name: Test
        shell: pwsh
        run: |
          $resultDirectory = Join-Path $env:RUNNER_TEMP "agentnotify-test-results"
          dotnet test tests/AgentNotify.Tests/AgentNotify.Tests.csproj --configuration Release --no-build --no-restore --results-directory $resultDirectory --logger "trx;LogFileName=test-results.trx"
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $resultPath = Join-Path $resultDirectory "test-results.trx"
            if (Test-Path $resultPath) {
              [xml]$results = Get-Content -Raw $resultPath
              $failed = Select-Xml -Xml $results -XPath "//*[local-name()='UnitTestResult' and @outcome='Failed']"
              foreach ($failure in $failed) {
                $name = $failure.Node.testName -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                $detail = $failure.Node.Output.ErrorInfo.Message
                if ([string]::IsNullOrWhiteSpace($detail)) { $detail = $name }
                $detail = $detail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::error title=Failed test: $name::$detail"
              }
            } else {
              Write-Host "::error title=Test results unavailable::dotnet test exited with code $testExitCode before writing its TRX result."
            }
          }
          exit $testExitCode
      - name: Package installer and embedded resources
        shell: pwsh
        run: ./scripts/package.ps1
