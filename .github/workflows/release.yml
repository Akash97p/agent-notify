name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags are needed so the release notes can link a compare range to the previous release.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify tag matches product version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version."
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Project version '$version' is not valid SemVer-style release metadata."
          }
      - name: Build, test, and package
        shell: pwsh
        run: |
          dotnet restore AgentNotify.slnx
          dotnet build AgentNotify.slnx --configuration Release --no-restore
          dotnet test tests/AgentNotify.Tests/AgentNotify.Tests.csproj --configuration Release --no-build --no-restore
          ./scripts/package.ps1
      # The description comes from CHANGELOG.md rather than generated commit notes, so the
      # release explains what changed instead of only linking to a diff. release-notes.sh fails
      # when the changelog has no section for this tag, which stops an empty release going out.
      - name: Build release notes
        shell: bash
        run: |
          previous="$(git tag --list 'v*' --sort=-version:refname | grep -v "^$GITHUB_REF_NAME$" | head -1)"
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" "$previous" > "$RUNNER_TEMP/release-notes.md"
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @(
            $env:GITHUB_REF_NAME,
            "artifacts/AgentNotifySetup.exe#AgentNotify Windows x64 installer",
            "artifacts/SHA256SUMS.txt#SHA-256 checksum for the Windows installer",
            "distribution/agentnotify/SKILL.md#AgentNotify agent skill",
            "--verify-tag",
            "--notes-file",
            "$env:RUNNER_TEMP/release-notes.md",
            "--title",
            "AgentNotify $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME -match '-') {
            $releaseArgs += "--prerelease"
          }
          gh release create @releaseArgs

  cross-platform-assets:
    # The Windows job publishes the installer. This one adds the portable macOS and Linux binaries,
    # which cross-compile from any host, and attaches them to the same release.
    needs: package-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish portable archives
        run: |
          ./scripts/publish-cross.sh
          mv artifacts/cross/SHA256SUMS.txt artifacts/cross/SHA256SUMS-portable.txt
      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts/cross
          gh release upload "$GITHUB_REF_NAME" \
            agentnotify-win-x64.zip \
            agentnotify-linux-x64.tar.gz \
            agentnotify-linux-arm64.tar.gz \
            agentnotify-osx-x64.tar.gz \
            agentnotify-osx-arm64.tar.gz \
            SHA256SUMS-portable.txt#SHA-256 checksums for the portable archives \
            --clobber
