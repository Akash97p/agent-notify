<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentNotify Insights dashboard showing usage, cost, live quota, and broker health">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#1e1e1e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#0b0b0b"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1199" height="719" stroke="#262626"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="56" fill="#0f0f0f"/>
  <path d="M0 56.5H1200" stroke="#262626"/>
  <circle cx="28" cy="28" r="5" fill="#2f2f2f"/>
  <circle cx="46" cy="28" r="5" fill="#2f2f2f"/>
  <circle cx="64" cy="28" r="5" fill="#2f2f2f"/>
  <text x="92" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8f8f8f">127.0.0.1:8787/ui/overview</text>
  <rect x="1010" y="16" width="164" height="24" rx="6" fill="#151515" stroke="#262626"/>
  <circle cx="1026" cy="28" r="4" fill="#e5e5e5"/>
  <text x="1038" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a3a3a3">broker online</text>

  <!-- sidebar -->
  <path d="M176.5 56V720" stroke="#262626"/>
  <text x="24" y="96" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f5f5f5">AgentNotify</text>
  <text x="24" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">loopback · local</text>
  <g font-family="Geist, system-ui, sans-serif" font-size="13">
    <rect x="14" y="140" width="148" height="30" rx="7" fill="#191919"/>
    <text x="30" y="160" fill="#f5f5f5">Overview</text>
    <text x="30" y="196" fill="#8f8f8f">Notifications</text>
    <text x="30" y="228" fill="#8f8f8f">Questions</text>
    <text x="30" y="260" fill="#8f8f8f">Usage</text>
    <text x="30" y="292" fill="#8f8f8f">Live quota</text>
    <text x="30" y="324" fill="#8f8f8f">Routing</text>
    <text x="30" y="356" fill="#8f8f8f">Channels</text>
    <text x="30" y="388" fill="#8f8f8f">Settings</text>
