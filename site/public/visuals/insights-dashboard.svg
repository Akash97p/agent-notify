    <rect x="668" y="544" width="16" height="120" rx="3"/><rect x="692" y="566" width="16" height="98" rx="3"/>
    <rect x="716" y="578" width="16" height="86" rx="3"/><rect x="740" y="592" width="16" height="72" rx="3"/>
    <rect x="764" y="606" width="16" height="58" rx="3"/><rect x="788" y="620" width="16" height="44" rx="3"/>
