  <path d="M14 660H162" stroke="#1e1e1e"/>
  <text x="30" y="684" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">contract 4</text>

  <!-- header row -->
  <text x="208" y="102" font-family="Geist, system-ui, sans-serif" font-size="22" font-weight="600" fill="#f5f5f5">Overview</text>
  <text x="208" y="124" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#8f8f8f">Attention, usage, quota, and routing for this broker.</text>
