    <rect x="868" y="548" width="280" height="6" rx="3" fill="#1f1f1f"/><rect x="868" y="548" width="129" height="6" rx="3" fill="#e5e5e5"/>
    <text x="868" y="572" fill="#a3a3a3">Codex</text><text x="1096" y="572" fill="#f5f5f5">38%</text>
  </g>
  <rect x="844" y="592" width="328" height="92" rx="12" fill="#111111" stroke="#242424"/>
  <text x="868" y="620" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Routing</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="868" y="644" fill="#a3a3a3">requests today</text><text x="1096" y="644" fill="#f5f5f5">418</text>
    <text x="868" y="666" fill="#a3a3a3">failovers</text><text x="1096" y="666" fill="#f5f5f5">3</text>
