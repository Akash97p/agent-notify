  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6f6f6f">
    <text x="232" y="676">Aug 21</text><text x="506" y="676">Sep 04</text><text x="762" y="676">Sep 19</text>
  </g>

