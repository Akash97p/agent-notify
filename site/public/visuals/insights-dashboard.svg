    <rect x="332" y="622" width="16" height="42" rx="3"/><rect x="356" y="600" width="16" height="64" rx="3"/>
    <rect x="380" y="612" width="16" height="52" rx="3"/><rect x="404" y="588" width="16" height="76" rx="3"/>
