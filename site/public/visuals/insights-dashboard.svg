  </g>

  <!-- attention row -->
  <rect x="208" y="152" width="964" height="104" rx="12" fill="#111111" stroke="#242424"/>
  <text x="232" y="180" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Waiting for you</text>
  <text x="232" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">3 unresolved · deduplicated by key</text>
  <g font-family="Geist, system-ui, sans-serif" font-size="12">
    <rect x="232" y="214" width="284" height="26" rx="7" fill="#191919" stroke="#262626"/>
    <text x="244" y="231" fill="#e5e5e5">permission · deploy approval</text>
    <rect x="528" y="214" width="284" height="26" rx="7" fill="#191919" stroke="#262626"/>
    <text x="540" y="231" fill="#e5e5e5">input_required · schema choice</text>
    <rect x="824" y="214" width="284" height="26" rx="7" fill="#191919" stroke="#262626"/>
    <text x="836" y="231" fill="#e5e5e5">blocked · staging credential</text>
  </g>
  <text x="1140" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">phone</text>

  <!-- quota cards -->
  <g>
    <rect x="208" y="276" width="308" height="188" rx="12" fill="#111111" stroke="#242424"/>
    <text x="232" y="306" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Codex · primary</text>
    <text x="232" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">five-hour window · resets 21:40</text>
    <text x="232" y="386" font-family="Geist, system-ui, sans-serif" font-size="40" font-weight="600" fill="#f5f5f5">62<tspan font-size="20" fill="#8f8f8f">% left</tspan></text>
    <rect x="232" y="410" width="260" height="8" rx="4" fill="#1f1f1f"/>
    <rect x="232" y="410" width="161" height="8" rx="4" fill="#e5e5e5"/>
    <text x="232" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">source: provider probe · fresh 42s</text>
  </g>
  <g>
    <rect x="532" y="276" width="308" height="188" rx="12" fill="#111111" stroke="#242424"/>
    <text x="556" y="306" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Claude · weekly</text>
    <text x="556" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">seven-day window · resets Mon</text>
    <text x="556" y="386" font-family="Geist, system-ui, sans-serif" font-size="40" font-weight="600" fill="#f5f5f5">41<tspan font-size="20" fill="#8f8f8f">% left</tspan></text>
    <rect x="556" y="410" width="260" height="8" rx="4" fill="#1f1f1f"/>
    <rect x="556" y="410" width="107" height="8" rx="4" fill="#a3a3a3"/>
    <text x="556" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">2 accounts tracked · menu bar</text>
  </g>
  <g>
    <rect x="856" y="276" width="316" height="188" rx="12" fill="#111111" stroke="#242424"/>
    <text x="880" y="306" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">OpenCode Go · monthly</text>
    <text x="880" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">estimated from published caps</text>
    <text x="880" y="386" font-family="Geist, system-ui, sans-serif" font-size="40" font-weight="600" fill="#f5f5f5">18<tspan font-size="20" fill="#8f8f8f">% left</tspan></text>
    <rect x="880" y="410" width="268" height="8" rx="4" fill="#1f1f1f"/>
    <rect x="880" y="410" width="48" height="8" rx="4" fill="#6f6f6f"/>
    <text x="880" y="442" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">estimate, not a provider balance</text>
  </g>

  <!-- usage chart -->
  <rect x="208" y="488" width="620" height="196" rx="12" fill="#111111" stroke="#242424"/>
  <text x="232" y="518" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f5f5f5">Local usage · 30 days</text>
  <text x="232" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6f6f6f">1.24B tokens · $412.90 estimated at published rates</text>
